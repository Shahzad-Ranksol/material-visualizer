<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hollin</title>
    <meta name="description" content="Try real finishes on kitchens, fencing, media walls, cabinets and wardrobes.">
    <meta property="og:title" content="Material Visualizer">
    <meta property="og:description" content="Try real finishes on kitchens, fencing, media walls, cabinets and wardrobes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The two faces of the apps: Playfair Display for display type, Familjen Grotesk for everything else -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#f6f3ec">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Familjen Grotesk"', 'system-ui', '-apple-system', 'sans-serif'],
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              grotesk: ['"Familjen Grotesk"', 'system-ui', 'sans-serif'],
            },
            colors: {
              // The preset-scene studio: warm paper ground, hairline rules, spruce ink, brass for selection
              paper: '#f6f3ec',
              mist: '#eeeae1',
              line: '#ddd7ca',
              plaster: '#e3e6e2',
              spruce: { DEFAULT: '#1e2b29', soft: '#5e6a67' },
              brass: { DEFAULT: '#a9824a', light: '#d9c39c' },
              atelier: {
                950: '#0b0c10',
                900: '#12141c',
                850: '#161824',
                800: '#1d202e',
                700: '#282c3f',
              },
              champagne: {
                300: '#f5e6cc',
                400: '#e5c49f',
                500: '#d4b28c',
                600: '#c8a97e',
              }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",

<style>
  /* Design-style reveal: a soft light passes across the changed area */
  @keyframes style-sweep { from { left: -50%; opacity: 1; } to { left: 110%; opacity: 0.6; } }
  /* A finish just rolled on: a wet sheen passes over the painted area, then dries off */
  @keyframes wet-sheen { from { transform: translateX(-60%) skewX(-18deg); opacity: 0; } 25% { opacity: 1; } to { transform: translateX(160%) skewX(-18deg); opacity: 0; } }
  /* The finish popover / bottom sheet entering */
  @keyframes pop-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
  /* Big screens (a showroom's 100-inch 4K panel): the customer pages scale up in steps, so the layout
     keeps about 1500–1750 px of room and type, photo and controls grow with the screen instead of
     sitting small in the middle of it */
  /* (--app-zoom lets a height in vh, which zoom scales too, be divided back to the screen's) */
  .app-scale { --app-zoom: 1; zoom: var(--app-zoom); }
  @media (min-width: 1800px) { .app-scale { --app-zoom: 1.2; } }
  @media (min-width: 2200px) { .app-scale { --app-zoom: 1.45; } }
  @media (min-width: 2800px) { .app-scale { --app-zoom: 1.85; } }
  @media (min-width: 3400px) { .app-scale { --app-zoom: 2.2; } }
  /* The picture's frame (components/configurator/PictureFrame.tsx), on the front page and every step.
     The picture always covers its frame, cut evenly off the sides (or top and bottom); --crop-x /
     --crop-y say how much, so the chips on the picture (.at-*) stay inside the frame.
     Phones and tablets: portrait, 4:5, but never taller than half the screen (it stays pinned at the
     top while the step scrolls under it). Wide screens: as tall as the screen leaves room for, from
     3:4 of its width (squarer) down to 1.9:1 */
  .picture-wrap { container-type: inline-size; }
  .picture-frame {
    position: relative; container-type: size; width: 100%; aspect-ratio: 4 / 5; max-height: 50svh;
    overflow: hidden; border-radius: 1rem;
    box-shadow: 0 24px 50px -32px rgba(30, 43, 41, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.05);
  }
  .picture-box {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: max(100cqw, 100cqh * var(--scene-aspect)); aspect-ratio: var(--scene-aspect);
    --crop-x: max(0px, (100cqh * var(--scene-aspect) - 100cqw) / 2);
    --crop-y: max(0px, (100cqw / var(--scene-aspect) - 100cqh) / 2);
    --inset: 0.625rem;
  }
  .at-tl { left: calc(var(--crop-x, 0px) + var(--inset, 0.75rem)); top: calc(var(--crop-y, 0px) + var(--inset, 0.75rem)); }
  .at-tr { right: calc(var(--crop-x, 0px) + var(--inset, 0.75rem)); top: calc(var(--crop-y, 0px) + var(--inset, 0.75rem)); }
  .at-br { right: calc(var(--crop-x, 0px) + var(--inset, 0.75rem)); bottom: calc(var(--crop-y, 0px) + var(--inset, 0.75rem)); }
  .at-b { bottom: calc(var(--crop-y, 0px) + var(--inset, 0.75rem) * 1.6); }
  @media (min-width: 640px) { .picture-box { --inset: 0.75rem; } }
  @media (min-width: 1024px) {
    .picture-frame {
      aspect-ratio: auto; max-height: none;
      height: clamp(calc(100cqw / 1.9), calc(100vh / var(--app-zoom, 1) - var(--frame-top, 146px)), calc(100cqw * 3 / 4));
    }
  }
  /* The apps' paper ground from the first paint (the dev pages set their own dark one) */
  body {
    background-color: #f6f3ec;
    color: #1e2b29;
    font-family: 'Familjen Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* Always keep the scrollbar's room, so the page (and the picture) never narrows on a taller step */
  html {
    scrollbar-gutter: stable;
  }

  /* Custom luxury scrollbar */
  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: rgba(251, 191, 36, 0.3);
  }

  .custom-scrollbar::-webkit-scrollbar {
    width: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background-color: rgba(255, 255, 255, 0.12);
    border-radius: 9999px;
  }

  .scrollbar-none::-webkit-scrollbar {
    display: none;
  }
</style>

</head>
<body class="min-h-screen bg-paper text-spruce selection:bg-brass/25 selection:text-spruce">

</html>
